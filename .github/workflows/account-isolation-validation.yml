name: Account Isolation Validation

on:
  push:
    branches: [master, codex/account-switch-assets]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install media inspection tools
        run: |
          sudo timeout 180s apt-get -o Acquire::Retries=2 update
          sudo timeout 180s apt-get -o Acquire::Retries=2 install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install -e './backend[test]'
          npm ci --prefix tools/client-docs --ignore-scripts
      - name: Verify generated client documentation
        run: node tools/client-docs/build.mjs --check
      - name: Run backend tests with branch coverage
        working-directory: backend
        run: pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=90
